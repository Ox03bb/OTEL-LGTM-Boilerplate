# ================================================================
# Receivers Section
# ================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/agent:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 10s
          static_configs:
            - targets: [127.0.0.1:8888]

  hostmetrics/agent:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.limit:
            enabled: true
      network:
      paging:
      processes:
      process:
        mute_process_user_error: true
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true
          process.threads:
            enabled: true

# ================================================================
# Processors Section
# ================================================================

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  resource/agent:
    attributes:
      - action: upsert
        key: service.namespace
        value: agent
  batch:
    timeout: 1s
    send_batch_size: 1024
  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]
  transform:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["host.name"], resource.attributes["host.name"])
          - set(attributes["process.command"], resource.attributes["process.command"])
          - set(attributes["process.command_line"], resource.attributes["process.command_line"])
          - set(attributes["process.executable.name"], resource.attributes["process.executable.name"])
          - set(attributes["process.executable.path"], resource.attributes["process.executable.path"])
          - set(attributes["process.owner"], resource.attributes["process.owner"])
          - set(attributes["process.parent_pid"], resource.attributes["process.parent_pid"])
          - set(attributes["process.pid"], resource.attributes["process.pid"])


# ================================================================
# Exporters Section
# ================================================================

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    resource_to_telemetry_conversion:
      enabled: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

extensions:
  health_check:


# ================================================================
# Service Section
# ================================================================

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
      level: detailed
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp] 
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/mimir]

    metrics/agent:
      receivers: [prometheus/agent, hostmetrics/agent]
      processors: [resource/agent, resourcedetection/system, transform, batch]
      exporters: [prometheusremotewrite/mimir]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
