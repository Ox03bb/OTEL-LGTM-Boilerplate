apiVersion: 1

datasources:
  - name: Mimir
    uid: MIMIR_DS
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false

  - name: Loki
    uid: LOKI_DS
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Tempo
    uid: TEMPO_DS
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: LOKI_DS
        tags:
          - key: service.name
            value: service.name
        customQuery: true
        query: '{service_name="${__span.tags["service.name"]}"}'
